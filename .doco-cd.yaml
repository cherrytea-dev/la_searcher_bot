# Конфиг doco-cd для деплоя в ядро инфраструктуры (репозиторий infra).
#
# Имя стека в Docker. После первого деплоя менять нельзя: doco-cd создаст второй
# проект рядом, а контейнеры старого останутся висеть (infra/docs/ARCHITECTURE.md).
#
# Имя совпадает с APP=la_searcher для `make db-create` в ядре: оттуда приходят
# роль, база и файл секретов /srv/infra/secrets/la_searcher.env.
name: la_searcher

# Файлы читаются по порядку и мержатся: сначала серверная часть приложения,
# затем накладка с внешними сетями ядра, секретами с хоста и ротацией логов.
#
# docker-compose.app.yml (локальный запуск с Postgres на борту) и docker-compose.yml
# (CI/тесты) здесь намеренно не указаны: на сервере база берётся из общего postgres
# ядра, а тестовый стек на прод не едет.
compose_files:
  - docker-compose.prod.yml
  - docker-compose.shared.yml
