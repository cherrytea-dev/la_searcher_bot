name: Run-Tests

on:
  pull_request:
    branches: [main, dev]

permissions:
  pull-requests: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # The suite runs in a single process here (make ci-test -> make test-serial): xdist workers
    # share one test database and their interleaving makes single tests fail from run to run.
    # Serial is slower than -n 4, hence the generous timeout.
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v3
      - name: Build containers and run tests
        run: |
          make ci-test
