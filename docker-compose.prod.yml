# Серверная (прод) часть приложения: один контейнер `python -m app.main`.
#
# Читает doco-cd вместе с docker-compose.shared.yml (список файлов — в .doco-cd.yaml).
# Локальный запуск с Postgres на борту остаётся за docker-compose.app.yml; CI/тесты —
# за docker-compose.yml. Этот файл их не заменяет и подключается только на сервере.
#
# Здесь намеренно нет ни сервиса db, ни публикации портов, ни секретов:
#   * база и роль — в общем postgres ядра (`make db-create APP=la_searcher`);
#   * наружу порты публикует только caddy ядра (и только если нужен домен/вебхуки);
#   * секреты приходят из /srv/infra/secrets/la_searcher.env (docker-compose.shared.yml).
services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile.app
    restart: unless-stopped
    # Целевой профиль (1 CPU / 1 GB) — тот же, что в docker-compose.app.yml:
    # «влезает ли» должен отвечать контейнер, а не таблица.
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1g
